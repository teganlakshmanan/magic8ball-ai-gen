
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion Test</title>
</head>
<body style="background:black;color:white;font:20px sans-serif;padding:24px">
  <button id="start" style="font-size:22px;padding:16px">
    Start motion test
  </button>
  <pre id="result" style="white-space:pre-wrap">Not started</pre>

  <script>
    const result = document.getElementById("result");

    document.getElementById("start").addEventListener("click", async () => {
      result.textContent = "Requesting access...";

      try {
        if (typeof DeviceMotionEvent === "undefined") {
          result.textContent = "DeviceMotionEvent is unavailable";
          return;
        }

        if (typeof DeviceMotionEvent.requestPermission === "function") {
          const permission = await DeviceMotionEvent.requestPermission();
          result.textContent = "Permission: " + permission;

          if (permission !== "granted") return;
        }

        window.addEventListener("devicemotion", event => {
          const a = event.accelerationIncludingGravity;
          result.textContent = a
            ? `Motion received!\nX: ${a.x}\nY: ${a.y}\nZ: ${a.z}`
            : "Motion event received; acceleration unavailable";
        });

        result.textContent += "\nNow shake your device...";
      } catch (error) {
        result.textContent =
          "Error: " + error.name + "\n" + error.message;
      }
    });
  </script>
</body>
</html>
