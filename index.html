
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Magic 8 Ball">
  <link rel="manifest" href="./manifest.json">
  <title>Magic 8 Ball</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    #triangle {
      position: relative;
      width: min(88vw, 78vh);
      height: min(79vw, 70vh);
      max-width: 700px;
      max-height: 650px;
      flex-shrink: 0;
      background: #064cff;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      -webkit-clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    #answer {
      position: absolute;
      top: 12%;
      left: 19%;
      width: 62%;
      height: 49%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      font-size: clamp(17px, 3.4vmin, 30px);
      font-weight: bold;
      line-height: 1.15;
      overflow-wrap: break-word;
      overflow: hidden;
    }

    @media (orientation: landscape) {
      #triangle {
        width: min(72vh, 75vw);
        height: min(65vh, 68vw);
      }

      #answer {
        font-size: clamp(17px, 3.2vmin, 28px);
      }
    }

  
    /* Liquid-like tumbling motion */
    #triangle {
      transform-origin: center center;
      will-change: transform;
      transition: transform 90ms ease-out;
    }
    
    #triangle.tumbling {
      transition: transform 90ms ease-out;
    }

    
  </style>
</head>

<body>
  <main id="triangle">
    <div id="answer"></div>
  </main>

  <script>
    (() => {
      const answers = [
        "It is certain",
        "It is decidedly so",
        "Without a doubt",
        "Yes, definitely",
        "You may rely on it",
        "As I see it, yes",
        "Most likely",
        "Outlook good",
        "Yes",
        "Signs point to yes",
        "Reply hazy, try again",
        "Ask again later",
        "Better not tell you now",
        "Cannot predict now",
        "Concentrate and ask again",
        "Don't count on it",
        "My reply is no",
        "My sources say no",
        "Outlook not so good",
        "Very doubtful"
      ];

      const answer = document.getElementById("answer");

      
      const triangle = document.getElementById("triangle");
      
      let tumbleTimer = null;
      let tumbleFrame = 0;
      
      function tumbleTriangle() {
        triangle.classList.add("tumbling");
      
        // A quick, irregular tumble with a liquid-like sense of inertia.
        const angle = (Math.random() - 0.5) * 70;
        const tiltX = (Math.random() - 0.5) * 32;
        const tiltY = (Math.random() - 0.5) * 32;
        const driftX = (Math.random() - 0.5) * 36;
        const driftY = (Math.random() - 0.5) * 36;
      
        triangle.style.transform =
          `perspective(700px) translate(${driftX}px, ${driftY}px) ` +
          `rotateX(${tiltX}deg) rotateY(${tiltY}deg) rotate(${angle}deg)`;
      
        clearTimeout(tumbleTimer);
      
        tumbleTimer = setTimeout(() => {
          triangle.style.transform =
            "perspective(700px) translate(0, 0) rotateX(0deg) rotateY(0deg) rotate(0deg)";
      
          tumbleTimer = null;
        }, 160);
      }


      let previousAnswer = -1;
      let motionEnabled = false;
      let requesting = false;
      let ySamples = [];
      let lastTrigger = 0;

      function showAnswer() {
        let next;
        do {
          next = Math.floor(Math.random() * answers.length);
        } while (next === previousAnswer);

        previousAnswer = next;
        answer.textContent = answers[next];
      }

      function onMotion(event) {
        const data = event.accelerationIncludingGravity;
        if (!data || data.y == null) return;

        const now = Date.now();

        // Track ONLY Y-axis readings over a short time window.
        ySamples.push({ y: data.y, time: now });
        ySamples = ySamples.filter(s => now - s.time <= 400);

        if (ySamples.length < 3) return;

        const values = ySamples.map(s => s.y);
        const range = Math.max(...values) - Math.min(...values);

        // Ignore small fluctuations. Require a large Y-axis change.
        if (range >= 12 && now - lastTrigger >= 1200) {
          lastTrigger = now;
          ySamples = [];
          tumbleTriangle();
          showAnswer();
        }
      }

      async function startMotion() {
        if (motionEnabled || requesting) return;
        if (typeof DeviceMotionEvent === "undefined") return;

        requesting = true;

        try {
          if (
            typeof DeviceMotionEvent.requestPermission === "function"
          ) {
            const permission =
              await DeviceMotionEvent.requestPermission();

            if (permission !== "granted") {
              requesting = false;
              return;
            }
          }

          window.addEventListener("devicemotion", onMotion);
          motionEnabled = true;
        } catch (_) {
          // Keep the screen free of messages.
        }

        requesting = false;
      }

      // First tap enables motion access; it does not change the answer.
      document.addEventListener("pointerdown", startMotion);

      // Show the first answer immediately.
      showAnswer();

      // Register offline support.
      if ("serviceWorker" in navigator &&
          location.protocol === "https:") {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    })();
  </script>
</body>
</html>
