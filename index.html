
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Magic 8 Ball">
  <link rel="manifest" href="./manifest.json">
  <title>Magic 8 Ball</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    #triangle {
      position: relative;
      width: min(88vw, 78vh);
      height: min(79vw, 70vh);
      max-width: 700px;
      max-height: 650px;
      background: #064cff;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      -webkit-clip-path: polygon(0 0, 100% 0, 50% 100%);
      flex-shrink: 0;
    }

    #answer {
      position: absolute;
      top: 12%;
      left: 19%;
      width: 62%;
      height: 49%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      font-size: clamp(17px, 3.4vmin, 30px);
      font-weight: 700;
      line-height: 1.15;
      overflow-wrap: break-word;
      overflow: hidden;
    }

    @media (orientation: landscape) {
      #triangle {
        width: min(72vh, 75vw);
        height: min(65vh, 68vw);
      }

      #answer {
        font-size: clamp(17px, 3.2vmin, 28px);
      }
    }
  </style>
</head>

<body>
  <main id="triangle" aria-label="Magic 8 Ball">
    <div id="answer"></div>
  </main>

  <script>
    (() => {
      "use strict";

      const answers = [
        "It is certain",
        "It is decidedly so",
        "Without a doubt",
        "Yes, definitely",
        "You may rely on it",
        "As I see it, yes",
        "Most likely",
        "Outlook good",
        "Yes",
        "Signs point to yes",
        "Reply hazy, try again",
        "Ask again later",
        "Better not tell you now",
        "Cannot predict now",
        "Concentrate and ask again",
        "Don't count on it",
        "My reply is no",
        "My sources say no",
        "Outlook not so good",
        "Very doubtful"
      ];

      const answerElement = document.getElementById("answer");

      let lastAnswer = -1;
      let lastShakeTime = 0;
      let permissionRequested = false;
      let motionEnabled = false;
      let baseline = null;

      function showAnswer() {
        let next;

        // Avoid repeating the immediately previous answer.
        do {
          next = Math.floor(Math.random() * answers.length);
        } while (next === lastAnswer);

        lastAnswer = next;
        answerElement.textContent = answers[next];
      }

      function onMotion(event) {
        const acceleration =
          event.accelerationIncludingGravity;

        if (!acceleration) return;

        const x = acceleration.x;
        const y = acceleration.y;
        const z = acceleration.z;

        if (x == null || y == null || z == null) return;

        const now = Date.now();

        if (!baseline) {
          baseline = { x, y, z };
          return;
        }

        // Estimate sudden movement relative to the recent baseline.
        const dx = x - baseline.x;
        const dy = y - baseline.y;
        const dz = z - baseline.z;

        const strength = Math.sqrt(
          dx * dx + dy * dy + dz * dz
        );

        // Smooth the baseline to filter ordinary movement.
        baseline.x = baseline.x * 0.75 + x * 0.25;
        baseline.y = baseline.y * 0.75 + y * 0.25;
        baseline.z = baseline.z * 0.75 + z * 0.25;

        // Require a noticeable shake and allow time between answers.
        if (strength > 13 && now - lastShakeTime > 1000) {
          lastShakeTime = now;
          showAnswer();
          baseline = { x, y, z };
        }
      }

      async function enableMotion() {
        if (permissionRequested) return;
        permissionRequested = true;

        try {
          if (
            typeof DeviceMotionEvent !== "undefined" &&
            typeof DeviceMotionEvent.requestPermission === "function"
          ) {
            const permission =
              await DeviceMotionEvent.requestPermission();

            if (permission !== "granted") return;
          }

          if ("DeviceMotionEvent" in window && !motionEnabled) {
            window.addEventListener("devicemotion", onMotion);
            motionEnabled = true;
          }
        } catch (_) {
          // Keep the display clean if sensor access is unavailable.
        }
      }

      // iPadOS may require a user gesture before sensor permission
      // can be requested. The tap itself does not change the answer.
      document.addEventListener("pointerdown", enableMotion, {
        passive: true
      });

      // Start with an answer immediately.
      showAnswer();

      // Register the offline cache.
      if ("serviceWorker" in navigator && location.protocol === "https:") {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js")
            .catch(() => {});
        });
      }
    })();
  </script>
</body>
</html>
