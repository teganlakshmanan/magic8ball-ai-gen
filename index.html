<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050913">
<meta name="description" content="A 3D Magic 8 Ball. Think of a yes-or-no question, then shake your phone or tap the ball for one of its 20 classic answers.">
<title>Magic 8 Ball</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse 74% 61% at 50% 42%,#1a2742 0%,#0d1629 48%,#050913 100%);color:#dae5f4;-webkit-tap-highlight-color:transparent}
main{height:100vh;height:100svh;width:100%;display:grid;place-items:center;position:relative;overflow:hidden;isolation:isolate}
.stage{width:min(94vw,74svh,680px);height:auto;aspect-ratio:1;position:relative;display:grid;place-items:center;perspective:950px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;outline:0;z-index:1}
.stage:focus-visible{outline:2px solid #b4caff;outline-offset:6px;border-radius:50%}
.aura{pointer-events:none;position:absolute;inset:0%;border-radius:50%;background:radial-gradient(circle,#5a7ed220 2%,#4162aa1a 45%,transparent 72%);filter:blur(28px);transform:scale(1.20)}
.floor-shadow{pointer-events:none;position:absolute;left:16%;right:16%;bottom:-6%;height:11%;border-radius:50%;background:#000a;filter:blur(22px);transform:scale(.85)}
/* Both faces are real HTML/CSS. The ball is visible without JavaScript, WebGL, network, or motion permission. */
.bob{width:92%;height:92%;position:relative;transform-style:preserve-3d;animation:bob 4.5s ease-in-out infinite}
.ball{position:relative;width:100%;height:100%;border-radius:50%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transform:rotateY(0deg);will-change:transform}
.face{position:absolute;inset:0;display:grid;place-items:center;border-radius:50%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:radial-gradient(circle at 23% 16%,#4a566d 0%,#25344e 13%,#0b1326 37%,#030710 66%,#02040b 80%,#14213b 100%);box-shadow:inset -32px -32px 40px #000b,inset 8px 7px 18px #9fb9e41d,0 0 2px #7a97cb33}
.face:before{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(ellipse 24% 34% at 26% 21%,#dbe9ff50 0%,#94bbe321 22%,transparent 95%);filter:blur(13px)}
.face:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:50%;box-shadow:inset 0 0 0 1px #accafa16,inset -8px -10px 29px #0009}
.front{transform:rotateY(0deg)}
.back{transform:rotateY(180deg)}
.badge{width:46%;height:46%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 29% 18%,#fff 0%,#f0f5ff 31%,#d5e0f2 75%,#b2bfd6 100%);box-shadow:inset -4px -6px 13px #8b99b650,inset 3px 4px 9px #fff9,0 2px 12px #bdd5fd55,0 0 0 3px #0004;position:relative;z-index:1;color:#091121;font-weight:850;font-family:Arial,Helvetica,sans-serif;font-size:clamp(85px,20vw,155px);line-height:1;letter-spacing:-.08em;padding-right:.075em;padding-bottom:.035em}
/* Recessed glass viewing port, with a beveled blue three-dimensional answer face. */
.port-frame{height:67%;width:67%;position:relative;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#00030a 3%,#010916 36%,#1b2b4b 67%,#01050e 86%);box-shadow:0 1px 2px #7c97b733,inset 9px 11px 15px #000,inset -8px -8px 12px #35517e55,0 0 0 4px #02040a,0 0 0 6px #8da9e01c;z-index:1}
.port{position:absolute;inset:7%;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#113f89 0%,#071d4a 36%,#010716 73%,#00010a 100%);box-shadow:inset 0 0 32px 8px #000e,0 0 22px #477df74d}
.port:before{position:absolute;inset:0;content:"";background:conic-gradient(from 30deg,#8bc2fa00,#9dcaff09 8%,#142d6900 22%,#a8d4ff15 40%,#0000 70%,#639cf209);animation:water 8s linear infinite}
.port:after{position:absolute;content:"";inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(ellipse at 32% 18%,#b4dcff1a,transparent 43%);box-shadow:inset 0 0 20px 11px #000a}
.die-wrap{width:86%;height:86%;display:grid;place-items:center;perspective:460px;position:relative;z-index:1}
.die{width:100%;height:100%;position:relative;transform-style:preserve-3d;will-change:transform;filter:drop-shadow(0 7px 8px #0009) drop-shadow(0 0 9px #64a0f778)}
.die:before{content:"";position:absolute;inset:0;clip-path:polygon(50% 4%,96% 88%,4% 88%);background:linear-gradient(137deg,#9ec5ff 2%,#487edf 24%,#1e57b8 62%,#06194a 100%);box-shadow:inset 0 0 16px #b5d8ff;z-index:1}
.die:after{content:"";position:absolute;inset:3%;clip-path:polygon(50% 6%,93% 87%,7% 87%);background:linear-gradient(155deg,#afd0ff55,transparent 22%,#020a360d 70%,#01051eaa);z-index:2;pointer-events:none}
.die-lines{position:absolute;z-index:3;left:12%;right:12%;top:36%;height:39%;display:flex;flex-flow:column nowrap;align-items:center;justify-content:center;text-align:center;color:#f7fbff;font:800 clamp(11px,2.55vw,18px)/1.10 Arial,Helvetica,sans-serif;letter-spacing:.025em;text-shadow:0 0 7px #b1d5ff,0 1px 2px #0b2550;white-space:nowrap;opacity:1}
.die-lines > div{display:block}
.die-lines.small{font-size:clamp(10px,2.25vw,16px)}
.die-lines.tiny{font-size:clamp(9px,1.95vw,14px)}
.die-gleam{position:absolute;inset:1%;clip-path:polygon(50% 4%,96% 88%,50% 80%);background:linear-gradient(115deg,#b7e0ff28,#6aa4ff0c,transparent);z-index:2;pointer-events:none}
.ball.revealed{transform:rotateY(180deg)}
.ball.spinning-first{animation:spin-first 2.5s cubic-bezier(.26,.04,.16,1) both}
.ball.spinning-again{animation:spin-again 2.5s cubic-bezier(.26,.04,.16,1) both}
.ball.spinning-first .die,.ball.spinning-again .die{animation:die-tumble .39s linear infinite}
.ball.spinning-first .die-lines,.ball.spinning-again .die-lines{opacity:0}
@keyframes spin-first{0%{transform:rotateY(0deg) rotateX(0deg) rotateZ(0deg)}12%{transform:rotateY(240deg) rotateX(17deg) rotateZ(-12deg)}39%{transform:rotateY(770deg) rotateX(-19deg) rotateZ(11deg)}68%{transform:rotateY(1390deg) rotateX(14deg) rotateZ(-8deg)}100%{transform:rotateY(1620deg) rotateX(0) rotateZ(0)}}
@keyframes spin-again{0%{transform:rotateY(180deg) rotateX(0deg) rotateZ(0deg)}12%{transform:rotateY(410deg) rotateX(-15deg) rotateZ(12deg)}39%{transform:rotateY(870deg) rotateX(21deg) rotateZ(-13deg)}68%{transform:rotateY(1410deg) rotateX(-12deg) rotateZ(7deg)}100%{transform:rotateY(1620deg) rotateX(0) rotateZ(0)}}
@keyframes die-tumble{0%{transform:rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(.82)}50%{transform:rotateX(170deg) rotateY(150deg) rotateZ(160deg) scale(.95)}100%{transform:rotateX(360deg) rotateY(360deg) rotateZ(360deg) scale(.82)}}
@keyframes bob{0%,100%{transform:translateY(0px) rotateZ(-.6deg)}50%{transform:translateY(-8px) rotateZ(.6deg)}}
@keyframes water{to{transform:rotate(360deg)}}
.hint{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:12px;right:12px;text-align:center;font-size:clamp(10px,1.6vw,12px);font-weight:550;text-transform:uppercase;letter-spacing:.13em;color:#8d9db7;margin:0;pointer-events:none;z-index:2}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;clip:rect(0,0,0,0);overflow:hidden;white-space:nowrap;border:0}
@media (max-height:520px){.stage{width:min(75vw,80svh,500px)}.hint{bottom:8px}}
@media (prefers-reduced-motion:reduce){.bob,.port:before{animation:none}.ball.spinning-first,.ball.spinning-again{animation-duration:.01ms}.ball.spinning-first .die,.ball.spinning-again .die{animation:none}}
</style>
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<main>
 <div class="stage" id="stage" tabindex="0" role="button" aria-label="Magic 8 Ball. Think of a yes-or-no question, then tap or shake your phone.">
  <div class="aura" aria-hidden="true"></div>
  <div class="floor-shadow" aria-hidden="true"></div>
  <div class="bob" aria-hidden="true">
   <div class="ball" id="ball">
    <div class="face front"><div class="badge">8</div></div>
    <div class="face back"><div class="port-frame"><div class="port"><div class="die-wrap"><div class="die"><div class="die-gleam"></div><div class="die-lines" id="dieLines"><div>?</div></div></div></div></div></div></div>
   </div>
  </div>
 </div>
 <p class="hint" id="hint">Think of a yes / no question · tap or shake</p>
 <span class="sr" id="answerText" role="status" aria-live="polite"></span>
</main>
<script>
(function(){
 'use strict';
 const replies=[
  ['It is certain',['IT IS','CERTAIN']],
  ['It is decidedly so',['IT IS','DECIDEDLY','SO']],
  ['Without a doubt',['WITHOUT','A DOUBT']],
  ['Yes, definitely',['YES,','DEFINITELY']],
  ['You may rely on it',['YOU MAY','RELY ON IT']],
  ['As I see it, yes',['AS I SEE','IT, YES']],
  ['Most likely',['MOST','LIKELY']],
  ['Outlook good',['OUTLOOK','GOOD']],
  ['Yes',['YES']],
  ['Signs point to yes',['SIGNS','POINT TO','YES']],
  ['Reply hazy, try again',['REPLY HAZY,','TRY AGAIN']],
  ['Ask again later',['ASK AGAIN','LATER']],
  ['Better not tell you now',['BETTER NOT','TELL YOU','NOW']],
  ['Cannot predict now',['CANNOT','PREDICT','NOW']],
  ['Concentrate and ask again',['CONCENTRATE','AND ASK','AGAIN']],
  ["Don't count on it",["DON'T",'COUNT ON','IT']],
  ['My reply is no',['MY REPLY','IS NO']],
  ['My sources say no',['MY SOURCES','SAY NO']],
  ['Outlook not so good',['OUTLOOK','NOT SO','GOOD']],
  ['Very doubtful',['VERY','DOUBTFUL']]
 ];
 const stage=document.getElementById('stage'),ball=document.getElementById('ball'),die=document.getElementById('dieLines'),hint=document.getElementById('hint'),announcement=document.getElementById('answerText');
 let busy=false,revealed=false,motionEnabled=false,permissionRequested=false,drag=null,lastShake=-Infinity;
 const secure=window.isSecureContext || location.hostname==='localhost';
 let audio;
 function sound(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audio=audio||new C();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter(),t=audio.currentTime;o.type='triangle';o.frequency.setValueAtTime(125,t);o.frequency.exponentialRampToValueAtTime(47,t+.42);f.type='lowpass';f.frequency.value=250;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.09,t+.035);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(f);f.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.52)}catch(e){}}
 function randomIndex(){if(window.crypto&&window.crypto.getRandomValues){const n=new Uint32Array(1);window.crypto.getRandomValues(n);return n[0]%replies.length}return Math.floor(Math.random()*replies.length)}
 function shake(){const now=performance.now();if(busy||now-lastShake<300)return;lastShake=now;busy=true;let chosen=replies[randomIndex()];announcement.textContent='';die.replaceChildren();die.className='die-lines';hint.textContent='Shaking…';ball.className='ball '+(revealed?'spinning-again':'spinning-first');if(navigator.vibrate)try{navigator.vibrate([25,35,45])}catch(e){}sound();
  const complete=()=>{if(!busy)return;busy=false;revealed=true;ball.className='ball revealed';die.replaceChildren(...chosen[1].map(line=>{const d=document.createElement('div');d.textContent=line;return d}));const longest=Math.max(...chosen[1].map(v=>v.length));die.className='die-lines'+(longest>=13?' tiny':longest>=10?' small':'');announcement.textContent=chosen[0];hint.textContent=motionEnabled?'Tap or shake again':'Tap again';};
  // An explicit timer is retained because HTML previews sometimes never emit animationend.
  setTimeout(complete,window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches?120:2550);
 }
 // iOS requires requesting permission in a user gesture and hosting on HTTPS.
 let prev=[0,0,0],grav=[0,0,0],pulses=[],lastPulse=-Infinity,lastEvent=0;
 function movement(ev){let a=ev.acceleration,v;if(a&&[a.x,a.y,a.z].every(Number.isFinite)){v=[a.x,a.y,a.z]}else{let b=ev.accelerationIncludingGravity;if(!b)return;const r=[b.x||0,b.y||0,b.z||0];v=r.map((x,i)=>{grav[i]=grav[i]*.86+x*.14;return x-grav[i]})}const t=performance.now();if(t-lastEvent>800)prev=v;lastEvent=t;let energy=Math.hypot(...v),jerk=Math.hypot(...v.map((x,i)=>x-prev[i]));prev=v;if(busy)return;if((energy>11||jerk>14)&&t-lastPulse>140){lastPulse=t;pulses.push(t);pulses=pulses.filter(x=>t-x<1200);if(pulses.length>=2){pulses=[];shake()}}}
 function startMotion(){if(motionEnabled)return;window.addEventListener('devicemotion',movement,{passive:true});motionEnabled=true;}
 function enableMotion(){if(motionEnabled||permissionRequested||!('DeviceMotionEvent' in window)||!secure)return;
  const d=window.DeviceMotionEvent;
  if(typeof d.requestPermission!=='function'){startMotion();return}
  permissionRequested=true;
  try{d.requestPermission().then(r=>{if(r==='granted')startMotion()}).catch(()=>{})}catch(e){}
 }
 if('DeviceMotionEvent' in window&&typeof DeviceMotionEvent.requestPermission!=='function'&&secure)startMotion();
 let pointerStart=null;
 stage.addEventListener('pointerdown',e=>{pointerStart={x:e.clientX,y:e.clientY,t:performance.now()};try{stage.setPointerCapture(e.pointerId)}catch(err){}});
 stage.addEventListener('pointerup',e=>{enableMotion();if(!pointerStart)return;const distance=Math.hypot(e.clientX-pointerStart.x,e.clientY-pointerStart.y),time=performance.now()-pointerStart.t;pointerStart=null;if(distance<24||(distance>50&&time<950))shake()});
 stage.addEventListener('pointercancel',()=>{pointerStart=null});
 stage.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();enableMotion();shake()}});
 // Ensure basic tap interaction on older mobile browsers lacking Pointer Events.
 if(!('PointerEvent' in window))stage.addEventListener('click',()=>{enableMotion();shake()});
 if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
